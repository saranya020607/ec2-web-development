version: 0.0
os: linux

files:
  - source: /
    destination: /opt/student-performance-ml

file_exists_behavior: OVERWRITE

hooks:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root


